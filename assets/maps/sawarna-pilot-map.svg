<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Ocean Gradient -->
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3aaec9"/>
      <stop offset="45%" stop-color="#56B8D0"/>
      <stop offset="100%" stop-color="#216a9e"/>
    </linearGradient>

    <!-- Deep Sea -->
    <linearGradient id="deepSea" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1b5a88"/>
      <stop offset="100%" stop-color="#2d87b3"/>
    </linearGradient>

    <!-- Sand Gradient -->
    <linearGradient id="sandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4df"/>
      <stop offset="40%" stop-color="#F2DEAD"/>
      <stop offset="100%" stop-color="#dfc58e"/>
    </linearGradient>

    <!-- Grass Gradient -->
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b6d798"/>
      <stop offset="70%" stop-color="#A7C78B"/>
      <stop offset="100%" stop-color="#8fae72"/>
    </linearGradient>

    <!-- Rock Cliff Gradient -->
    <linearGradient id="rockGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#dfcaa7"/>
      <stop offset="50%" stop-color="#C5A47E"/>
      <stop offset="100%" stop-color="#8c6d48"/>
    </linearGradient>

    <!-- Tanjung Layar Iconic Rocks -->
    <linearGradient id="tanjungLayarGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#bba078"/>
      <stop offset="50%" stop-color="#8e704b"/>
      <stop offset="100%" stop-color="#564027"/>
    </linearGradient>

    <!-- Shadows -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#183B50" flood-opacity="0.18"/>
    </filter>
    <filter id="rockShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="6" dy="10" stdDeviation="6" flood-color="#0c2535" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 1. OCEAN BACKGROUND -->
  <rect width="1200" height="800" fill="url(#oceanGrad)" />

  <!-- Ocean Waves & Currents Texture -->
  <g opacity="0.45" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round">
    <!-- Top Right Waves -->
    <path d="M 850 80 Q 900 65 950 80 T 1050 80 T 1150 80" />
    <path d="M 880 120 Q 930 105 980 120 T 1080 120" />
    <path d="M 960 160 Q 1010 145 1060 160 T 1160 160" />

    <!-- Tanjung Layar Surrounding Waves -->
    <path d="M 800 240 Q 840 220 880 240 T 960 240 T 1040 240" stroke-width="3.5" opacity="0.75" />
    <path d="M 820 270 Q 860 250 900 270 T 980 270" stroke-width="2" />
    <path d="M 840 330 Q 880 310 920 330 T 1000 330" stroke-width="3" opacity="0.6" />

    <!-- Open Sea Waves Bottom Right -->
    <path d="M 1020 400 Q 1060 385 1100 400 T 1180 400" />
    <path d="M 980 460 Q 1020 445 1060 460 T 1140 460" />
    <path d="M 1050 520 Q 1090 505 1130 520 T 1200 520" />
  </g>

  <!-- Decorative Fishing Boat -->
  <g transform="translate(1040, 190) scale(0.9)" opacity="0.85">
    <!-- Hull -->
    <path d="M 0 15 Q 20 25 50 20 Q 55 10 40 5 L 10 5 Z" fill="#ffffff" stroke="#183B50" stroke-width="1.5" />
    <path d="M 15 5 L 25 -15 L 30 5 Z" fill="#E8A23A" />
    <circle cx="22" cy="7" r="2.5" fill="#2878B8" />
    <path d="M -5 22 Q 25 28 55 22" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.7"/>
  </g>

  <!-- 2. SHALLOW WATER / LAGOON / REEF EDGES -->
  <path d="M 80 800 C 120 700, 180 620, 240 500 C 300 380, 420 300, 580 230 C 740 160, 920 180, 1020 240 C 1080 280, 1140 370, 1200 420 L 1200 800 Z" 
        fill="#72d3e5" opacity="0.55" />
  <path d="M 100 800 C 140 710, 200 630, 260 520 C 320 410, 440 330, 600 260 C 760 190, 900 210, 1000 270 C 1050 310, 1110 390, 1160 450 L 1200 800 Z" 
        fill="#94e4f0" opacity="0.65" />

  <!-- 3. BEACH COASTLINE (SAND TERRAIN) -->
  <path d="M 0 800 L 0 680 C 60 670, 120 650, 170 580 C 230 490, 290 390, 420 310 C 530 250, 670 210, 800 220 C 910 230, 980 290, 1020 370 C 1060 450, 1110 540, 1200 600 L 1200 800 Z" 
        fill="url(#sandGrad)" filter="url(#softShadow)" />

  <!-- Shoreline Foam Line -->
  <path d="M 0 680 C 60 670, 120 650, 170 580 C 230 490, 290 390, 420 310 C 530 250, 670 210, 800 220 C 910 230, 980 290, 1020 370 C 1060 450, 1110 540, 1200 600" 
        fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.85" />
  <path d="M 0 680 C 60 670, 120 650, 170 580 C 230 490, 290 390, 420 310 C 530 250, 670 210, 800 220 C 910 230, 980 290, 1020 370 C 1060 450, 1110 540, 1200 600" 
        fill="none" stroke="#e8f8fb" stroke-width="12" stroke-linecap="round" opacity="0.35" />

  <!-- 4. INLAND GRASS / VEGETATION HILLS -->
  <path d="M 0 800 L 0 710 C 40 700, 90 680, 130 630 C 180 560, 230 480, 340 430 C 440 380, 520 380, 640 400 C 740 420, 820 480, 870 560 C 920 640, 970 700, 1050 740 C 1100 760, 1150 780, 1200 780 L 1200 800 Z" 
        fill="url(#grassGrad)" filter="url(#softShadow)" />

  <!-- Back Vegetation Ridge (Top Left & Center) -->
  <path d="M 0 760 C 70 750, 120 720, 160 670 C 200 620, 240 550, 310 520 C 390 490, 470 510, 560 520 C 660 530, 750 580, 800 640 C 850 700, 890 750, 970 780 L 1200 800 L 0 800 Z" 
        fill="#8fae72" opacity="0.45" />

  <!-- 5. TANJUNG LAYAR - ICONIC TWIN ROCK FORMATIONS -->
  <g id="tanjungLayarRocks" filter="url(#rockShadow)">
    <!-- Reflection/Shading in Water -->
    <ellipse cx="880" cy="300" rx="65" ry="22" fill="#1b5a88" opacity="0.4" />
    <ellipse cx="945" cy="315" rx="45" ry="16" fill="#1b5a88" opacity="0.4" />

    <!-- Main Sail Rock 1 (Tall Sail-shaped Cliff) -->
    <path d="M 830 300 C 835 240, 860 170, 885 150 C 905 170, 915 220, 925 295 C 905 305, 855 310, 830 300 Z" 
          fill="url(#tanjungLayarGrad)" stroke="#46311a" stroke-width="2.5" />
    <!-- Rock Form Crags and Highlights -->
    <path d="M 885 150 L 888 230 L 870 295" stroke="#d5be9b" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M 865 210 L 880 240 L 850 290" stroke="#46311a" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M 895 200 L 910 260" stroke="#46311a" stroke-width="2" fill="none" opacity="0.6"/>

    <!-- Twin Sail Rock 2 (Adjacent Sharp Rock) -->
    <path d="M 920 310 C 930 265, 940 215, 955 195 C 968 220, 975 260, 980 305 C 960 315, 935 315, 920 310 Z" 
          fill="url(#tanjungLayarGrad)" stroke="#46311a" stroke-width="2" />
    <!-- Crags -->
    <path d="M 955 195 L 950 255 L 965 305" stroke="#d5be9b" stroke-width="1.8" fill="none" opacity="0.7"/>

    <!-- Small Reef Rocks Scattered -->
    <ellipse cx="810" cy="310" rx="14" ry="7" fill="#6d5437" stroke="#46311a" stroke-width="1.5"/>
    <ellipse cx="995" cy="320" rx="18" ry="9" fill="#6d5437" stroke="#46311a" stroke-width="1.5"/>
    <ellipse cx="930" cy="330" rx="12" ry="6" fill="#806443" stroke="#46311a" stroke-width="1.5"/>

    <!-- Water Splash / Foam around rocks -->
    <path d="M 818 305 Q 845 295 870 306 T 925 306 T 985 314" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.8"/>
  </g>

  <!-- 6. PEDESTRIAN & ACCESS PATHWAYS -->
  <g id="pathways" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Entrance Road from South-West (Tan / Wooden Path) -->
    <path d="M 230 750 C 240 700, 250 670, 270 650 C 290 630, 330 610, 370 590 C 430 560, 500 520, 560 500 C 640 475, 720 465, 790 470 C 840 475, 870 500, 890 530" 
          fill="none" stroke="#c09e74" stroke-width="20" />
    <path d="M 230 750 C 240 700, 250 670, 270 650 C 290 630, 330 610, 370 590 C 430 560, 500 520, 560 500 C 640 475, 720 465, 790 470 C 840 475, 870 500, 890 530" 
          fill="none" stroke="#EFE0C4" stroke-width="14" />

    <!-- Branch to Parking -->
    <path d="M 260 660 C 220 665, 190 650, 160 630" 
          fill="none" stroke="#c09e74" stroke-width="14" />
    <path d="M 260 660 C 220 665, 190 650, 160 630" 
          fill="none" stroke="#EFE0C4" stroke-width="10" />

    <!-- Branch to Mushola & Toilet 1 -->
    <path d="M 370 590 C 370 540, 390 520, 420 520" 
          fill="none" stroke="#c09e74" stroke-width="12" />
    <path d="M 370 590 C 370 540, 390 520, 420 520" 
          fill="none" stroke="#EFE0C4" stroke-width="8" />

    <!-- Branch to Beachfront & Gazebo -->
    <path d="M 560 500 C 580 430, 610 370, 630 330" 
          fill="none" stroke="#c09e74" stroke-width="10" />
    <path d="M 560 500 C 580 430, 610 370, 630 330" 
          fill="none" stroke="#EFE0C4" stroke-width="6" stroke-dasharray="4,6" />

    <!-- Trail to Tanjung Layar Viewpoint -->
    <path d="M 720 465 C 750 410, 800 350, 860 320" 
          fill="none" stroke="#c09e74" stroke-width="10" />
    <path d="M 720 465 C 750 410, 800 350, 860 320" 
          fill="none" stroke="#EFE0C4" stroke-width="6" stroke-dasharray="4,6" />
  </g>

  <!-- 7. PARKING LOT BASE -->
  <g id="parkingArea" transform="translate(110, 580)">
    <rect x="0" y="0" width="100" height="70" rx="8" fill="#d9c3a3" stroke="#b09370" stroke-width="2"/>
    <!-- Parking Bays -->
    <line x1="20" y1="5" x2="20" y2="35" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="45" y1="5" x2="45" y2="35" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="70" y1="5" x2="70" y2="35" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,3"/>
    <!-- Tiny cars -->
    <rect x="25" y="10" width="15" height="22" rx="3" fill="#2878B8"/>
    <rect x="50" y="10" width="15" height="22" rx="3" fill="#C94747"/>
    <rect x="75" y="12" width="15" height="20" rx="3" fill="#183B50"/>
  </g>

  <!-- 8. ILLUSTRATED BUILDINGS & SAUNG STRUCTURES -->
  <!-- Main Gate (Gapura) -->
  <g id="gateIllustration" transform="translate(245, 635)">
    <!-- Gate Pillars -->
    <rect x="0" y="0" width="8" height="28" rx="2" fill="#8c6d48" stroke="#46311a" stroke-width="1"/>
    <rect x="24" y="0" width="8" height="28" rx="2" fill="#8c6d48" stroke="#46311a" stroke-width="1"/>
    <!-- Roof Beam -->
    <polygon points="-4,2 16,-8 36,2 32,8 16,0 0,8" fill="#C5A47E" stroke="#46311a" stroke-width="1"/>
    <rect x="4" y="-3" width="24" height="6" fill="#E8A23A" rx="1"/>
  </g>

  <!-- Mushola (Green dome + white wall) -->
  <g id="musholaIllustration" transform="translate(405, 495)">
    <rect x="5" y="12" width="30" height="22" rx="3" fill="#ffffff" stroke="#183B50" stroke-width="1.5"/>
    <!-- Dome -->
    <path d="M 10 12 C 10 0, 30 0, 30 12 Z" fill="#69a557" stroke="#183B50" stroke-width="1.2"/>
    <!-- Crescent & Star -->
    <circle cx="20" cy="-2" r="2.5" fill="#E8A23A"/>
    <!-- Door -->
    <path d="M 16 34 L 16 23 C 16 20, 24 20, 24 23 L 24 34 Z" fill="#2878B8"/>
  </g>

  <!-- Warung Kuliner Saung (Village huts) -->
  <g id="warungIllustration" transform="translate(530, 435)">
    <!-- Hut 1 -->
    <rect x="0" y="10" width="24" height="18" fill="#d9b68c" stroke="#5a3d1c" stroke-width="1.2"/>
    <polygon points="-3,10 12,-2 27,10" fill="#a4713e" stroke="#5a3d1c" stroke-width="1.2"/>
    <!-- Hut 2 -->
    <rect x="28" y="12" width="26" height="18" fill="#e2c49f" stroke="#5a3d1c" stroke-width="1.2"/>
    <polygon points="25,12 41,0 57,12" fill="#b9824b" stroke="#5a3d1c" stroke-width="1.2"/>
    <!-- Hut 3 -->
    <rect x="58" y="8" width="24" height="20" fill="#d9b68c" stroke="#5a3d1c" stroke-width="1.2"/>
    <polygon points="55,8 70,-4 85,8" fill="#a4713e" stroke="#5a3d1c" stroke-width="1.2"/>
  </g>

  <!-- Gazebo Istirahat (Beachside saung) -->
  <g id="gazeboIllustration" transform="translate(705, 420)">
    <rect x="4" y="8" width="20" height="14" rx="2" fill="#f0dbbe" stroke="#5a3d1c" stroke-width="1"/>
    <polygon points="0,8 14,-2 28,8" fill="#C5A47E" stroke="#5a3d1c" stroke-width="1.2"/>
    <rect x="32" y="10" width="18" height="14" rx="2" fill="#f0dbbe" stroke="#5a3d1c" stroke-width="1"/>
    <polygon points="29,10 41,0 53,10" fill="#C5A47E" stroke="#5a3d1c" stroke-width="1.2"/>
  </g>

  <!-- Lifeguard Watchtower (Pos Balawista) -->
  <g id="lifeguardIllustration" transform="translate(770, 195)">
    <!-- Tower Legs -->
    <line x1="6" y1="36" x2="10" y2="12" stroke="#183B50" stroke-width="2"/>
    <line x1="24" y1="36" x2="20" y2="12" stroke="#183B50" stroke-width="2"/>
    <line x1="6" y1="24" x2="24" y2="24" stroke="#183B50" stroke-width="1.5"/>
    <!-- Cabin -->
    <rect x="6" y="2" width="18" height="14" fill="#C94747" stroke="#183B50" stroke-width="1.2"/>
    <!-- Red/Yellow Flag -->
    <line x1="22" y1="2" x2="22" y2="-10" stroke="#183B50" stroke-width="1.5"/>
    <polygon points="22,-10 32,-6 22,-2" fill="#E8A23A"/>
  </g>

  <!-- 9. COCONUT PALM TREES & SCATTERED VEGETATION -->
  <!-- Helper Macro for Palm Trees -->
  <g id="palmTrees">
    <!-- Palm 1 at Entrance -->
    <g transform="translate(300, 600) scale(0.8)">
      <path d="M 10 50 Q 8 25 18 0" stroke="#7a542b" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <path d="M 18 0 Q -5 -15 -18 -8" stroke="#4a7c36" stroke-width="3" fill="none"/>
      <path d="M 18 0 Q 30 -22 45 -10" stroke="#4a7c36" stroke-width="3" fill="none"/>
      <path d="M 18 0 Q 5 -25 12 -35" stroke="#5b9643" stroke-width="3" fill="none"/>
      <path d="M 18 0 Q 35 5 40 22" stroke="#5b9643" stroke-width="3" fill="none"/>
      <path d="M 18 0 Q -8 8 -15 20" stroke="#4a7c36" stroke-width="3" fill="none"/>
    </g>
    <!-- Palm 2 near Mushola -->
    <g transform="translate(460, 540) scale(0.9)">
      <path d="M 10 50 Q 15 25 8 0" stroke="#7a542b" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <path d="M 8 0 Q -15 -15 -28 -8" stroke="#4a7c36" stroke-width="3.2" fill="none"/>
      <path d="M 8 0 Q 25 -22 40 -12" stroke="#5b9643" stroke-width="3.2" fill="none"/>
      <path d="M 8 0 Q -2 -25 2 -35" stroke="#5b9643" stroke-width="3.2" fill="none"/>
      <path d="M 8 0 Q 30 8 35 22" stroke="#4a7c36" stroke-width="3.2" fill="none"/>
    </g>
    <!-- Palm 3 near Kuliner -->
    <g transform="translate(630, 480) scale(0.85)">
      <path d="M 10 50 Q 5 25 15 0" stroke="#7a542b" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <path d="M 15 0 Q -10 -18 -22 -10" stroke="#4a7c36" stroke-width="3" fill="none"/>
      <path d="M 15 0 Q 32 -20 48 -8" stroke="#5b9643" stroke-width="3" fill="none"/>
      <path d="M 15 0 Q 10 -25 18 -38" stroke="#5b9643" stroke-width="3" fill="none"/>
      <path d="M 15 0 Q 35 10 40 25" stroke="#4a7c36" stroke-width="3" fill="none"/>
    </g>
    <!-- Palm 4 & 5 at Gazebo beach edge -->
    <g transform="translate(670, 390) scale(0.75)">
      <path d="M 10 50 Q 18 25 10 0" stroke="#7a542b" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M 10 0 Q -12 -15 -25 -6" stroke="#4a7c36" stroke-width="3" fill="none"/>
      <path d="M 10 0 Q 28 -20 42 -10" stroke="#5b9643" stroke-width="3" fill="none"/>
      <path d="M 10 0 Q 6 -22 10 -32" stroke="#5b9643" stroke-width="3" fill="none"/>
    </g>
    <g transform="translate(790, 430) scale(0.8)">
      <path d="M 10 50 Q 4 25 14 0" stroke="#7a542b" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M 14 0 Q -10 -15 -22 -6" stroke="#4a7c36" stroke-width="3" fill="none"/>
      <path d="M 14 0 Q 30 -20 45 -10" stroke="#5b9643" stroke-width="3" fill="none"/>
      <path d="M 14 0 Q 10 -25 15 -35" stroke="#5b9643" stroke-width="3" fill="none"/>
    </g>
  </g>

  <!-- 10. COMPASS ROSE (Watermark Bottom Right) -->
  <g transform="translate(1120, 720) scale(0.8)" opacity="0.6">
    <circle cx="0" cy="0" r="32" fill="#ffffff" stroke="#183B50" stroke-width="2"/>
    <polygon points="0,-28 6,-4 0,0" fill="#C94747"/>
    <polygon points="0,-28 -6,-4 0,0" fill="#e07272"/>
    <polygon points="0,28 6,4 0,0" fill="#183B50"/>
    <polygon points="0,28 -6,4 0,0" fill="#536e7e"/>
    <polygon points="28,0 4,6 0,0" fill="#183B50"/>
    <polygon points="-28,0 -4,6 0,0" fill="#536e7e"/>
    <circle cx="0" cy="0" r="3.5" fill="#E8A23A"/>
    <text x="-4" y="-32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="12" fill="#C94747">U</text>
  </g>

  <!-- 11. MAP TITLE WATERMARK (Top-Left Vintage Ribbon Style) -->
  <g transform="translate(35, 30)">
    <rect x="0" y="0" width="280" height="64" rx="14" fill="#ffffff" opacity="0.92" stroke="#56B8D0" stroke-width="2" filter="url(#softShadow)"/>
    <text x="18" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#183B50">Pantai Sawarna</text>
    <text x="18" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11.5" fill="#2878B8">Peta Panduan Wisata Interaktif</text>
  </g>
</svg>
