<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Peta Pantai Ciantir</title>
  <meta name="description" content="Peta interaktif kawasan wisata Pantai Ciantir, Desa Sawarna.">
  <link rel="icon" href="brand/ikon/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="brand/ikon/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Yellowtail&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="brand/tokens.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="logo" src="brand/logo/sawarna-mark-web.png" alt="" width="40" height="30">
      <div>
        <h1>Peta Pantai Ciantir</h1>
        <p>Desa Sawarna · Lebak, Banten</p>
      </div>
    </div>
    <nav id="filter" class="filter" aria-label="Filter kategori layanan"></nav>
  </header>

  <main id="map" aria-label="Peta interaktif"></main>

  <div class="fab-stack">
    <button id="btn-kompas" class="fab kompas" title="Arah pandang peta" aria-label="Arah pandang peta" aria-expanded="false" aria-controls="panel-arah">
      <svg viewBox="0 0 40 40" aria-hidden="true"><g class="jarum"><path d="M20 6 L25 20 H15Z" fill="#D64545"/><path d="M20 34 L25 20 H15Z" fill="#A9B4C2"/><circle cx="20" cy="20" r="2.6" fill="#fff" stroke="#17283F" stroke-width="1"/><text x="20" y="5" text-anchor="middle" font-size="6.5" font-weight="800" fill="#D64545">U</text></g></svg>
    </button>
    <button id="btn-lokasi" class="fab" title="Lokasi saya" aria-label="Lokasi saya">◎</button>
    <button id="btn-reset" class="fab" title="Kembali ke tampilan awal" aria-label="Kembali ke tampilan awal">⌂</button>
    <button id="btn-koordinat" class="fab small" title="Ambil koordinat (untuk survei)" aria-label="Ambil koordinat">📍</button>
  </div>

  <section id="panel-arah" class="panel-arah" hidden aria-label="Arah pandang peta">
    <header>
      <div>
        <div class="pa-judul">Arah pandang</div>
        <div class="pa-nilai"><b id="pa-derajat">0°</b> <span id="pa-nama">Menghadap Utara</span></div>
      </div>
      <button class="pa-tutup" id="pa-tutup" aria-label="Tutup">✕</button>
    </header>
    <div class="pa-slider">
      <button class="pa-step" data-step="-45" aria-label="Putar 45 derajat ke kiri">⟲</button>
      <input type="range" id="pa-range" min="0" max="315" step="45" value="0" aria-label="Derajat arah pandang">
      <button class="pa-step" data-step="45" aria-label="Putar 45 derajat ke kanan">⟳</button>
    </div>
    <div class="pa-skala"><span>0°</span><span>90°</span><span>180°</span><span>270°</span><span>315°</span></div>
    <div class="pa-preset" id="pa-preset"></div>
    <p class="pa-tips">Tips: di HP putar peta dengan dua jari, di laptop tahan <kbd>Shift</kbd> lalu seret.</p>
  </section>

  <aside id="legend" class="legend" aria-label="Legenda"></aside>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <!-- leaflet-rotate (Raruto, GPL-3.0), disertakan lokal -->
  <script src="js/vendor/leaflet-rotate.js"></script>
  <script src="js/data.js"></script>
  <script src="js/popup.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
