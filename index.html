<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Peta Pantai Ciantir · Sawarna</title>
  <meta name="description" content="Peta interaktif kawasan wisata Pantai Ciantir, Desa Sawarna, Lebak, Banten.">
  <meta name="theme-color" content="#F7FBFC">
  <link rel="icon" href="brand/ikon/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="brand/ikon/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="brand/tokens.css?v=iso8">
  <link rel="stylesheet" href="css/style.css?v=iso8">
</head>
<body>
  <!-- Layar pembuka: logo memudar ±1 detik (DESIGN §4.1) -->
  <div id="pembuka" class="pembuka" aria-hidden="true">
    <div class="pembuka-isi">
      <img src="brand/logo/sawarna-logo-web.png" alt="" width="220" height="110">
      <p data-t="judul">Pantai Ciantir</p>
    </div>
    <svg class="pembuka-ombak" viewBox="0 0 400 40" preserveAspectRatio="none" aria-hidden="true"><path d="M0 22c33 0 33-10 67-10s33 10 66 10 34-10 67-10 33 10 67 10 33-10 66-10 34 10 67 10" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
  </div>

  <main id="map" aria-label="Peta Pantai Ciantir"></main>
  <div id="muat" class="muat" role="progressbar" aria-label="Memuat peta" hidden><span></span></div>

  <!-- Header & filter (DESIGN §4.2–4.3) -->
  <div class="atas">
    <header class="kartu header">
      <img class="header-logo" src="brand/logo/sawarna-mark-web.png" alt="Sawarna" width="28" height="22">
      <h1 data-t="judul">Pantai Ciantir</h1>
      <span id="tanda-offline" class="tanda-offline" hidden></span>
      <div class="bahasa" role="group" aria-label="Bahasa">
        <button type="button" data-bahasa="id" aria-pressed="true">ID</button>
        <button type="button" data-bahasa="en" aria-pressed="false">EN</button>
      </div>
    </header>
    <nav id="filter" class="filter" aria-label="Saring tempat"></nav>
  </div>

  <!-- Tombol mengambang (DESIGN §3) -->
  <div class="tumpuk" id="tumpuk">
    <button type="button" class="fab fab-aman" id="btn-aman" aria-haspopup="dialog"></button>
    <button type="button" class="fab fab-kompas" id="btn-kompas" aria-expanded="false" aria-controls="panel-arah"></button>
    <button type="button" class="fab" id="btn-lokasi" aria-pressed="false"></button>
    <div class="zoom-laptop">
      <button type="button" class="fab" id="btn-plus"></button>
      <button type="button" class="fab" id="btn-minus"></button>
    </div>
    <button type="button" class="fab" id="btn-koordinat" aria-pressed="false" hidden></button>
  </div>

  <!-- Panel arah pandang (DESIGN §4.8) -->
  <section id="panel-arah" class="kartu panel panel-arah" hidden aria-labelledby="pa-judul">
    <header class="panel-kepala">
      <div>
        <h2 id="pa-judul" class="panel-judul" data-t="arahPandang">Arah pandang</h2>
        <p class="pa-nilai"><b id="pa-derajat">225°</b> <span id="pa-nama"></span></p>
      </div>
      <button type="button" class="tutup" data-tutup="panel-arah"></button>
    </header>
    <div class="pa-slider">
      <button type="button" class="tombol-ikon" data-step="-45"></button>
      <input type="range" id="pa-range" min="0" max="315" step="45" value="225">
      <button type="button" class="tombol-ikon" data-step="45"></button>
    </div>
    <div class="pa-preset" id="pa-preset"></div>
    <p class="panel-catatan" data-t="tipsArah"></p>
  </section>


  <!-- Panel keselamatan (DESIGN §4.7) -->
  <dialog id="panel-aman" class="lembar aman" aria-labelledby="aman-judul">
    <div class="lembar-isi">
      <header class="panel-kepala">
        <h2 id="aman-judul" class="lembar-judul" data-t="keselamatanJudul">Keselamatan di pantai</h2>
        <button type="button" class="tutup" data-tutup="panel-aman"></button>
      </header>
      <div id="aman-isi"></div>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="js/data.js?v=iso8"></script>
  <script src="js/iso.js?v=iso8"></script>
  <script src="js/i18n.js?v=iso8"></script>
  <script src="js/ikon.js?v=iso8"></script>
  <script src="js/popup.js?v=iso8"></script>
  <script src="js/app.js?v=iso8"></script>
</body>
</html>
